limit_req_zone $binary_remote_addr zone=uestc_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=uestc_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name uestcai.top www.uestcai.top 47.84.83.142;
    client_max_body_size 26m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_req_status 429;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    # vinext client navigation uses this endpoint; keep other hidden paths blocked.
    location = /.rsc {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ~ /\. { deny all; }
    location /assets/ {
        root /opt/uestc-ai/current/dist/client;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /api/auth/ {
        limit_req zone=uestc_auth burst=10 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location /api/ {
        limit_req zone=uestc_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
